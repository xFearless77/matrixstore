<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatrixStore | Dijital & Teknoloji Mağazası</title>
    <style>
        /* Geçici Temel Tasarım */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #fff; margin: 0; padding: 20px; }
        header { text-align: center; padding: 20px 0; border-bottom: 2px solid #38bdf8; }
        h1 { color: #38bdf8; margin: 0; }
        .container { display: flex; gap: 20px; justify-content: center; margin-top: 30px; flex-wrap: wrap; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; width: 220px; text-align: center; }
        .card h3 { color: #f8fafc; margin-top: 0; }
        .price { color: #4ade80; font-size: 1.2rem; font-weight: bold; }
        .btn { background-color: #0284c7; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; margin-top: 10px; width: 100%; font-weight: bold; }
        .btn:hover { background-color: #0369a1; }
    </style>
</head>
<body>

    <header>
        <h1>MATRIX STORE</h1>
        <p>Geleceğin Teknolojisi & Dijital Çözümler</p>
    </header>

    <div class="container">
        <!-- 1. Ürün Kartı -->
        <div class="card">
            <h3>Python Otomasyon Botu</h3>
            <p class="price">250 TL</p>
            <p>Stok: 10 Adet</p>
            <button class="btn">Satın Al</button>
        </div>

        <!-- 2. Ürün Kartı -->
        <div class="card">
            <h3>E-Ticaret HTML Teması</h3>
            <p class="price">150 TL</p>
            <p>Stok: 5 Adet</p>
            <button class="btn">Satın Al</button>
        </div>
    </div>

</body>
</html>
