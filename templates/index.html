<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>MatrixStore</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; }
        .header { display: flex; justify-content: space-between; padding: 20px 50px; background: #1f1f1f; }
        .cart-btn { color: #00ff66; text-decoration: none; font-weight: bold; font-size: 18px; }
        .container { display: flex; justify-content: center; gap: 20px; margin-top: 40px; }
        .card { background: #1f1f1f; padding: 20px; border-radius: 8px; border: 1px solid #00ff66; width: 200px; }
        .btn { display: inline-block; padding: 10px; background: #00ff66; color: #000; text-decoration: none; font-weight: bold; margin-top: 10px; border-radius: 5px; }
        .disabled { background: #555; color: #888; pointer-events: none; }
    </style>
</head>
<body>

    <div class="header">
        <h1>MatrixStore</h1>
        <a href="/cart" class="cart-btn">🛒 Sepetim ({{ cart_count }})</a>
    </div>

    <h2>Ürünler</h2>
    <div class="container">
        {% for product in products %}
        <div class="card">
            <h3>{{ product.name }}</h3>
            <p>Fiyat: {{ product.price }} TL</p>
            <p>Stok: <strong>{{ product.stock }}</strong></p>
            
            {% if product.stock > 0 %}
                <a href="/add_to_cart/{{ product.id }}" class="btn">Sepete Ekle</a>
            {% else %}
                <span class="btn disabled">Stok Tükendi</span>
            {% endif %}
        </div>
        {% endfor %}
    </div>

</body>
</html>
