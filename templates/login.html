<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Giriş Yap - MatrixStore</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; margin-top: 80px; }
        .card { background: #1f1f1f; display: inline-block; padding: 30px; border-radius: 8px; border: 1px solid #00ff66; width: 300px; }
        input { display: block; margin: 10px auto; padding: 10px; width: 85%; }
        button { padding: 10px 20px; background: #00ff66; color: #000; font-weight: bold; border: none; cursor: pointer; border-radius: 4px; width: 90%; }
        a { color: #00ff66; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔑 Giriş Yap</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <p style="color: {% if category == 'success' %}#00ff66{% else %}red{% endif %};">{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form action="/login" method="POST">
            <input type="email" name="email" placeholder="E-posta" required>
            <input type="password" name="password" placeholder="Şifre" required>
            <button type="submit">Giriş Yap</button>
        </form>
        <br>
        <p>Hesabın yok mu? <a href="/register">Kayıt Ol</a></p>
    </div>
</body>
</html>
